<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Calculator</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles/style.css" />
    <script src="./assets/scripts/script2.js" defer></script>
    <script src="./assets/scripts/script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Calculator</h1>
    </header>

    <section id="calculator">
      <div class="input-group">
        <label for="input-number-1">First number</label>
        <input type="number" id="input-number-1" />
      </div>

      <div id="calc-actions">
        <button type="button" id="btn-add">+</button>
        <button type="button" id="btn-subtract">-</button>
        <button type="button" id="btn-multiply">*</button>
        <button type="button" id="btn-divide">/</button>
      </div>

      <div class="input-group">
        <label for="input-number-2">Second number</label>
        <input type="number" id="input-number-2" />
      </div>

      <button type="button" id="btn-equals">=</button>

      <p id="error-message"></p>
    </section>

    <section id="results" aria-live="polite">
      <h2 id="current-calculation">0</h2>
      <h2>Result: <span id="current-result">0</span></h2>
    </section>

    <button type="button" id="btn-reset">Reset</button>
  </body>
</html>
